<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雷达时频与生命体征联合监测看板</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body {
      background-color: #f1f2f6;
      color: #2f3542;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 12px;
    }
    h3 {
      margin: 0 0 8px 0;
      text-align: center;
      font-size: 16px;
    }
    #status {
      font-size: 12px;
      color: #e67e22;
      text-align: center;
      margin-bottom: 12px;
      font-weight: bold;
    }

    /* 原有时频网格布局：手机端竖屏排布，平板/宽屏并排排布 */
    .dashboard {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 960px;
      margin: 0 auto;
    }
    @media (min-width: 768px) {
      .dashboard {
        display: grid;
        grid-template-columns: 1fr 1.2fr;
        grid-template-rows: auto auto;
      }
      .box-i { grid-column: 1; grid-row: 1; }
      .box-q { grid-column: 1; grid-row: 2; }
      .box-fft { grid-column: 2; grid-row: 1 / span 2; }
    }

    /* 生命体征（呼吸率 & 心率随时间变化）区域 */
    .vitals-section {
      max-width: 960px;
      margin: 14px auto 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .vitals-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }
    .vital-metric-card {
      background: #ffffff;
      border: 1px solid #ced6e0;
      border-radius: 8px;
      padding: 12px 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .vital-label {
      font-size: 12px;
      color: #57606a;
      font-weight: 600;
    }
    .vital-value-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-top: 6px;
    }
    .vital-num {
      font-size: 28px;
      font-weight: 700;
    }
    .br-color { color: #0969da; }
    .hr-color { color: #cf222e; }
    .vital-unit {
      font-size: 12px;
      color: #57606a;
    }
    .vital-peak {
      margin-left: auto;
      font-size: 12px;
      color: #6e7781;
    }

    .chart-card {
      background: #ffffff;
      border: 1px solid #ced6e0;
      border-radius: 8px;
      padding: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .chart-title {
      font-size: 13px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 4px;
      color: #3742fa;
    }
    canvas {
      width: 100%;
      height: 180px;
      display: block;
      background: #ffffff;
    }
    .box-fft canvas {
      height: 380px;
    }
    .vitals-section canvas {
      height: 165px;
    }
  </style>
</head>
<body>
  <h3>5.8 GHz 雷达生命体征时频监测</h3>
  <div id="status">正在接入云端数据流...</div>

  <div class="dashboard">
    <!-- 左上: I 5.8 GHz -->
    <div class="chart-card box-i">
      <div class="chart-title">I 5.8 GHz (Time Domain)</div>
      <canvas id="canvasI"></canvas>
    </div>

    <!-- 左下: Q 5.8 GHz -->
    <div class="chart-card box-q">
      <div class="chart-title">Q 5.8 GHz (Time Domain)</div>
      <canvas id="canvasQ"></canvas>
    </div>

    <!-- 右侧: I+jQ FFT 5.8 GHz -->
    <div class="chart-card box-fft">
      <div class="chart-title">I+jQ FFT 5.8 (Frequency Domain)</div>
      <canvas id="canvasFFT"></canvas>
    </div>
  </div>

  <!-- 生命体征随时间变化区域 -->
  <div class="vitals-section">
    <div class="vitals-cards">
      <div class="vital-metric-card">
        <div class="vital-label">Breathing Rate (0.1 – 0.5 Hz)</div>
        <div class="vital-value-row">
          <span id="brValue" class="vital-num br-color">--</span>
          <span class="vital-unit">Breaths/min</span>
          <span id="brFreq" class="vital-peak">-- Hz</span>
        </div>
      </div>

      <div class="vital-metric-card">
        <div class="vital-label">Heart Rate (0.8 – 2.5 Hz)</div>
        <div class="vital-value-row">
          <span id="hrValue" class="vital-num hr-color">--</span>
          <span class="vital-unit">BPM</span>
          <span id="hrFreq" class="vital-peak">-- Hz</span>
        </div>
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-title" style="color: #0969da;">Breathing Rate vs. Time (Breaths/min)</div>
      <canvas id="canvasBRTime"></canvas>
    </div>

    <div class="chart-card">
      <div class="chart-title" style="color: #cf222e;">Heart Rate vs. Time (BPM)</div>
      <canvas id="canvasHRTime"></canvas>
    </div>
  </div>

  <script>
    const cvsI = document.getElementById('canvasI');
    const cvsQ = document.getElementById('canvasQ');
    const cvsFFT = document.getElementById('canvasFFT');
    const cvsBRTime = document.getElementById('canvasBRTime');
    const cvsHRTime = document.getElementById('canvasHRTime');

    const ctxI = cvsI.getContext('2d');
    const ctxQ = cvsQ.getContext('2d');
    const ctxFFT = cvsFFT.getContext('2d');
    const ctxBRTime = cvsBRTime.getContext('2d');
    const ctxHRTime = cvsHRTime.getContext('2d');
    const statusDiv = document.getElementById('status');

    // 适配高清屏幕像素比
    function resizeCanvas(cvs) {
      cvs.width = cvs.clientWidth * window.devicePixelRatio;
      cvs.height = cvs.clientHeight * window.devicePixelRatio;
    }
    function resizeAllCanvases() {
      [cvsI, cvsQ, cvsFFT, cvsBRTime, cvsHRTime].forEach(resizeCanvas);
    }
    window.addEventListener('resize', resizeAllCanvases);
    resizeAllCanvases();

    // 缓存时域数据（对齐采样点数）
    const Fs = 20; // 采样率 20Hz
    const windowSec = 15; // 滑动窗口时长
    const N = Fs * windowSec; // 窗口总采样点
    let bufferI = [];
    let bufferQ = [];

    // 生命体征时间序列缓存
    const brMinHz = 0.1;
    const brMaxHz = 0.5;
    const hrMinHz = 0.8;
    const hrMaxHz = 2.5;
    const smoothWindow = 5;
    const maxHistoryPoints = 80;

    const brSmoothBuf = [];
    const hrSmoothBuf = [];
    const brHistory = []; // { t: 秒, val: Breaths/min }
    const hrHistory = []; // { t: 秒, val: BPM }
    const startTimeMs = Date.now();

    // MQTT 连接
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
    const topic = 'hw_radar_test/vital_signs/iq_stream';

    client.on('connect', () => {
      statusDiv.innerText = "● 已实时连通云端 (MQTT/WebSocket)";
      statusDiv.style.color = "#2ed573";
      client.subscribe(topic);
    });

    client.on('message', (t, msg) => {
      const parts = msg.toString().split(',');
      if (parts.length >= 4) {
        // 索引 2 为 I 5.8GHz, 索引 3 为 Q 5.8GHz
        const valI = parseFloat(parts[2]);
        const valQ = parseFloat(parts[3]);

        if (Number.isFinite(valI) && Number.isFinite(valQ)) {
          bufferI.push(valI);
          bufferQ.push(valQ);
          if (bufferI.length > N) {
            bufferI.shift();
            bufferQ.shift();
          }

          renderDashboard();
        }
      }
    });

    // 在指定频段 [minHz, maxHz] 内寻找幅值最大点对应的频率 (Hz)
    function findPeakFreqInBand(magArray, df, minHz, maxHz) {
      const startBin = Math.max(1, Math.ceil(minHz / df));
      const endBin = Math.min(magArray.length - 1, Math.floor(maxHz / df));
      if (startBin > endBin) return null;

      let bestVal = -Infinity;
      let bestBin = -1;
      for (let i = startBin; i <= endBin; i++) {
        const v = magArray[i];
        if (Number.isFinite(v) && v > bestVal) {
          bestVal = v;
          bestBin = i;
        }
      }
      return bestBin === -1 ? null : bestBin * df;
    }

    function smoothValue(buf, val, winSize) {
      buf.push(val);
      if (buf.length > winSize) buf.shift();
      return buf.reduce((a, b) => a + b, 0) / buf.length;
    }

    // 绘图与信号处理管线
    function renderDashboard() {
      if (bufferI.length < 10) return;

      // 1. 去直流分量 (DC removal)
      const meanI = bufferI.reduce((a, b) => a + b, 0) / bufferI.length;
      const meanQ = bufferQ.reduce((a, b) => a + b, 0) / bufferQ.length;
      const cleanI = bufferI.map(v => v - meanI);
      const cleanQ = bufferQ.map(v => v - meanQ);

      // 2. 绘制时域图 I 与 Q
      drawTimeSeries(ctxI, cvsI, cleanI, "#1e90ff", "mV");
      drawTimeSeries(ctxQ, cvsQ, cleanQ, "#2ed573", "mV");

      // 3. 计算 FFT 频谱 (点数满足 2 的幂次)
      const fftLen = 256;
      let real = new Float32Array(fftLen);
      let imag = new Float32Array(fftLen);

      // 加汉明窗 (Hamming Window) 并填充数据
      const len = Math.min(cleanI.length, fftLen);
      for (let i = 0; i < len; i++) {
        const w = 0.54 - 0.46 * Math.cos((2 * Math.PI * i) / (len - 1));
        real[i] = cleanI[i] * w;
        imag[i] = cleanQ[i] * w;
      }

      // 执行原位复数 FFT
      transformFFT(real, imag);

      // 计算完整单边幅度谱（用于提取 0.1~0.5 Hz 呼吸率与 0.8~2.5 Hz 心率）
      const halfLen = fftLen / 2;
      const magFull = new Float32Array(halfLen);
      for (let i = 0; i < halfLen; i++) {
        magFull[i] = Math.sqrt(real[i] * real[i] + imag[i] * imag[i]) / len;
      }

      const df = Fs / fftLen;
      const elapsedSec = (Date.now() - startTimeMs) / 1000;

      // 提取呼吸率 (0.1 - 0.5 Hz -> Breaths/min)
      const brPeakHz = findPeakFreqInBand(magFull, df, brMinHz, brMaxHz);
      const brValueEl = document.getElementById('brValue');
      const brFreqEl = document.getElementById('brFreq');
      if (brPeakHz !== null) {
        const brVal = smoothValue(brSmoothBuf, brPeakHz * 60, smoothWindow);
        brHistory.push({ t: elapsedSec, val: brVal });
        if (brHistory.length > maxHistoryPoints) brHistory.shift();
        if (brValueEl) brValueEl.innerText = brVal.toFixed(1);
        if (brFreqEl) brFreqEl.innerText = `${brPeakHz.toFixed(3)} Hz`;
      }

      // 提取心率 (0.8 - 2.5 Hz -> BPM)
      const hrPeakHz = findPeakFreqInBand(magFull, df, hrMinHz, hrMaxHz);
      const hrValueEl = document.getElementById('hrValue');
      const hrFreqEl = document.getElementById('hrFreq');
      if (hrPeakHz !== null) {
        const hrVal = smoothValue(hrSmoothBuf, hrPeakHz * 60, smoothWindow);
        hrHistory.push({ t: elapsedSec, val: hrVal });
        if (hrHistory.length > maxHistoryPoints) hrHistory.shift();
        if (hrValueEl) hrValueEl.innerText = hrVal.toFixed(0);
        if (hrFreqEl) hrFreqEl.innerText = `${hrPeakHz.toFixed(3)} Hz`;
      }

      // 计算 dBm 幅值与频率轴映射（限制在 0~120 BPM 显示）
      let bpmList = [];
      let magdB = [];
      for (let i = 0; i < halfLen; i++) {
        const freqBPM = i * df * 60;
        if (freqBPM > 120) break;
        bpmList.push(freqBPM);
        const db = 20 * Math.log10(magFull[i] + 1e-6);
        magdB.push(db);
      }

      // 4. 绘制频谱图与随时间变化的呼吸率/心率曲线
      drawSpectrum(ctxFFT, cvsFFT, bpmList, magdB);
      drawVitalOverTime(ctxBRTime, cvsBRTime, brHistory, "#0969da", 5, 30, "Breaths/min");
      drawVitalOverTime(ctxHRTime, cvsHRTime, hrHistory, "#cf222e", 45, 150, "BPM");
    }

    // 绘制时域折线
    function drawTimeSeries(ctx, cvs, data, color, unit) {
      ctx.clearRect(0, 0, cvs.width, cvs.height);
      const pad = 35;
      const w = cvs.width - pad * 2;
      const h = cvs.height - pad * 2;

      const min = Math.min(...data);
      const max = Math.max(...data);
      const range = (max - min) || 1;

      ctx.strokeStyle = "#e4e7eb";
      ctx.lineWidth = 1;
      ctx.strokeRect(pad, pad, w, h);

      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2 * window.devicePixelRatio;
      for (let i = 0; i < data.length; i++) {
        const x = pad + (i / (N - 1)) * w;
        const y = pad + h - ((data[i] - min) / range) * h;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    // 绘制频域谱线
    function drawSpectrum(ctx, cvs, xBPM, ydB) {
      ctx.clearRect(0, 0, cvs.width, cvs.height);
      const pad = 40;
      const w = cvs.width - pad * 2;
      const h = cvs.height - pad * 2;

      const minDB = -70;
      const maxDB = 10;
      const maxBPM = 120;

      ctx.strokeStyle = "#e4e7eb";
      ctx.lineWidth = 1;
      ctx.strokeRect(pad, pad, w, h);

      ctx.beginPath();
      ctx.strokeStyle = "#3742fa";
      ctx.lineWidth = 2 * window.devicePixelRatio;

      for (let i = 0; i < xBPM.length; i++) {
        const x = pad + (xBPM[i] / maxBPM) * w;
        const normY = (ydB[i] - minDB) / (maxDB - minDB);
        const y = pad + h - Math.max(0, Math.min(1, normY)) * h;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    // 绘制生命体征随时间变化曲线 (Vital Sign vs. Time)
    function drawVitalOverTime(ctx, cvs, historyArr, color, yMin, yMax, unitText) {
      ctx.clearRect(0, 0, cvs.width, cvs.height);
      const dpr = window.devicePixelRatio || 1;
      const padLeft = 42 * dpr;
      const padRight = 16 * dpr;
      const padTop = 12 * dpr;
      const padBottom = 22 * dpr;
      const w = cvs.width - padLeft - padRight;
      const h = cvs.height - padTop - padBottom;

      ctx.strokeStyle = "#e4e7eb";
      ctx.lineWidth = 1 * dpr;
      ctx.strokeRect(padLeft, padTop, w, h);

      ctx.fillStyle = "#6e7781";
      ctx.font = `${10 * dpr}px -apple-system, sans-serif`;

      // 纵坐标上下限与中间刻度
      const ticks = [yMin, (yMin + yMax) / 2, yMax];
      ticks.forEach(tv => {
        const ratio = (tv - yMin) / (yMax - yMin);
        const y = padTop + h - ratio * h;
        ctx.beginPath();
        ctx.moveTo(padLeft, y);
        ctx.lineTo(padLeft + w, y);
        ctx.stroke();
        ctx.fillText(tv.toFixed(0), 4 * dpr, y + 3 * dpr);
      });

      if (historyArr.length === 0) {
        ctx.fillStyle = "#8c959f";
        ctx.fillText(`Waiting for ${unitText} time-series data...`, padLeft + 10 * dpr, padTop + h / 2);
        return;
      }

      const tStart = historyArr[0].t;
      const tEnd = historyArr[historyArr.length - 1].t;
      const tSpan = Math.max(1, tEnd - tStart);

      // 横坐标时间标签
      ctx.fillStyle = "#6e7781";
      ctx.fillText(`${tStart.toFixed(0)}s`, padLeft, cvs.height - 6 * dpr);
      ctx.fillText(`${tEnd.toFixed(0)}s (Time)`, padLeft + w - 58 * dpr, cvs.height - 6 * dpr);

      // 绘制随时间变化的折线
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2 * dpr;

      historyArr.forEach((pt, idx) => {
        const xRatio = historyArr.length === 1 ? 0.5 : (pt.t - tStart) / tSpan;
        const clamped = Math.max(yMin, Math.min(yMax, pt.val));
        const yRatio = (clamped - yMin) / (yMax - yMin);

        const x = padLeft + xRatio * w;
        const y = padTop + h - yRatio * h;

        if (idx === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
    }

    // 基础 Cooley-Tukey 快速傅里叶变换 (FFT) 算法
    function transformFFT(real, imag) {
      const n = real.length;
      let j = 0;
      for (let i = 0; i < n - 1; i++) {
        if (i < j) {
          let tr = real[i]; real[i] = real[j]; real[j] = tr;
          let ti = imag[i]; imag[i] = imag[j]; imag[j] = ti;
        }
        let k = n >> 1;
        while (k <= j) { j -= k; k >>= 1; }
        j += k;
      }
      for (let l = 2; l <= n; l <<= 1) {
        let ang = -2 * Math.PI / l;
        let wstep_r = Math.cos(ang), wstep_i = Math.sin(ang);
        for (let i = 0; i < n; i += l) {
          let wr = 1, wi = 0;
          for (let m = 0; m < l / 2; m++) {
            let u_r = real[i + m], u_i = imag[i + m];
            let v_r = real[i + m + l / 2] * wr - imag[i + m + l / 2] * wi;
            let v_i = real[i + m + l / 2] * wi + imag[i + m + l / 2] * wr;
            real[i + m] = u_r + v_r;
            imag[i + m] = u_i + v_i;
            real[i + m + l / 2] = u_r - v_r;
            imag[i + m + l / 2] = u_i - v_i;
            let twr = wr * wstep_r - wi * wstep_i;
            wi = wr * wstep_i + wi * wstep_r;
            wr = twr;
          }
        }
      }
    }
  </script>
</body>
</html>
